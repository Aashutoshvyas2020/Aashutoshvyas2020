name: Patch Starline auth gate

on:
  push:
    branches:
      - starline-catalog-deploy-20260724
    paths:
      - .github/workflows/patch-starline-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: starline-catalog-deploy-20260724
          fetch-depth: 0

      - name: Patch canonical sign-in routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import shutil

          archive = Path("starline-catalog-deploy.zip")
          work = Path(".starline-auth-patch")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()

          with ZipFile(archive, "r") as source:
              source.extractall(work)

          proxy = work / "netlify" / "edge-functions" / "proxy.ts"
          text = proxy.read_text(encoding="utf-8")

          helpers = r'''
function isDocumentRequest(request: Request): boolean {
  if (request.method !== "GET") return false;
  const destination = request.headers.get("sec-fetch-dest") || "";
  const accept = request.headers.get("accept") || "";
  return destination === "document" || accept.includes("text/html");
}

function hasAuthCookie(request: Request): boolean {
  const cookie = request.headers.get("cookie") || "";
  return /(?:^|;\\s*)nf_jwt=[^;]+/.test(cookie);
}

function isLegacySignInHtml(html: string): boolean {
  return (
    html.includes("Use Google to create or access your Starline account.") ||
    html.includes("Use Google to create or access your Starline account")
  );
}

'''

          if "function isDocumentRequest(request: Request)" not in text:
              marker = "function signInPage(request: Request): Response {"
              if marker not in text:
                  raise RuntimeError("Could not find signInPage marker")
              text = text.replace(marker, helpers + marker, 1)

          old_next = '  const next = safeNext(url.searchParams.get("next"), url.origin);'
          new_next = '''  const currentPath = `${url.pathname}${url.search}${url.hash}`;
  const requestedNext = url.searchParams.get("next") ??
    (["/sign-in", "/login"].includes(url.pathname) ? "/" : currentPath);
  const next = safeNext(requestedNext, url.origin);'''
          if old_next in text:
              text = text.replace(old_next, new_next, 1)
          elif "const requestedNext = url.searchParams.get" not in text:
              raise RuntimeError("Could not update sign-in return path")

          identity_block = '''  if (url.pathname.startsWith("/.netlify/identity/")) {
    return context.next();
  }
'''
          auth_gate = identity_block + '''
  // Every unauthenticated document request uses the same canonical auth page.
  // Asset and API requests continue to the upstream so the application can load normally.
  if (isDocumentRequest(request) && !hasAuthCookie(request)) {
    return signInPage(request);
  }
'''
          if "Every unauthenticated document request uses the same canonical auth page" not in text:
              if identity_block not in text:
                  raise RuntimeError("Could not find Identity bypass block")
              text = text.replace(identity_block, auth_gate, 1)

          old_proxy = '''  try {
    return await proxy(request);
  } catch (error) {'''
          new_proxy = '''  try {
    const upstream = await proxy(request);

    // A stale or invalid cookie can make the immutable upstream return its old
    // sign-in shell with HTTP 200. Replace that response with the canonical page.
    if (isDocumentRequest(request)) {
      const contentType = upstream.headers.get("content-type") || "";
      if (upstream.status === 401 || upstream.status === 403) {
        return signInPage(request);
      }
      if (contentType.includes("text/html")) {
        const html = await upstream.clone().text();
        if (isLegacySignInHtml(html)) return signInPage(request);
      }
    }

    return upstream;
  } catch (error) {'''
          if old_proxy in text:
              text = text.replace(old_proxy, new_proxy, 1)
          elif "A stale or invalid cookie can make the immutable upstream" not in text:
              raise RuntimeError("Could not add legacy auth fallback replacement")

          proxy.write_text(text, encoding="utf-8")

          rebuilt = archive.with_suffix(".zip.new")
          with ZipFile(rebuilt, "w", ZIP_DEFLATED) as target:
              for path in sorted(work.rglob("*")):
                  if path.is_file():
                      target.write(path, path.relative_to(work).as_posix())
          rebuilt.replace(archive)
          shutil.rmtree(work)
          PY

      - name: Commit patched deployment artifact
        shell: bash
        run: |
          git config user.name "Starline Build Bot"
          git config user.email "aashutoshvyas2010@gmail.com"
          git add starline-catalog-deploy.zip
          if git diff --cached --quiet; then
            echo "Artifact already patched."
          else
            git commit -m "Use canonical Starline sign-in everywhere [skip ci]"
            git push origin HEAD:starline-catalog-deploy-20260724
          fi
