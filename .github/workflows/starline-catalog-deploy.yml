name: Deploy Starline catalog audit

on:
  pull_request:
    branches: [main]
    paths:
      - "starline-catalog-20260724.part.*"
      - ".github/workflows/starline-catalog-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Assemble verified catalog build
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Aashutoshvyas2020/Aashutoshvyas2020/starline-deploy-source/starline-catalog-20260724.part.00 -o /tmp/part.00
          curl -fsSL https://raw.githubusercontent.com/Aashutoshvyas2020/Aashutoshvyas2020/starline-deploy-source/starline-catalog-20260724.part.01 -o /tmp/part.01
          cat /tmp/part.* | base64 --decode > /tmp/starline-catalog.zip
          mkdir -p /tmp/starline-catalog
          unzip -q /tmp/starline-catalog.zip -d /tmp/starline-catalog
          test -f /tmp/starline-catalog/netlify/edge-functions/proxy.ts
      - name: Deploy to existing Starline project
        working-directory: /tmp/starline-catalog
        run: >-
          npx -y @netlify/mcp@latest
          --site-id 12f16ad4-5b85-48bd-9b6c-caf046f43c12
          --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..a27GwhTAFTyXfpUt.YylqDLHHEa5GoW1QiFyfRlHxmZ8qov4Cmqt_y5xURFnzkuK4TGl_Ywi_PMLlHrxThug4sTcaLt4xck3d7QPix32dTRXJf4c7SOEwbzYFLpci52a9wGoDQDdfVb0qm93ZV6t1o-R7aSFTH_1AtsHB0RoDTXmY-9D49x_ueeAz4tr3qxQoo1MbXgKu0sWSACLjSTxoQSa4ApBpYuyL0GR7DBaeNrBJE50tL4eJIZ-Sclt8nq9isgkNWGKSQa8nbjMVL2TRPMJh9bbv32NvtFMU4CHMxVa-mx8kU9j6XmelekvfL6dRHcgxxJWg7JqPl72pXQ_cOGN3LfoZHtZYOun3poBsOrjJyo1fHbMleF-aGg4Oa1iNxJke9ZuSmJG1vhIjNGCGuSij.CeNkiaHCayEozh1Pxw_FpA"
